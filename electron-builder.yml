appId: com.ueconsole.adb
productName: UE Console ADB Tool
directories:
  buildResources: resources
  output: release
files:
  - dist
  - out
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
extraResources:
  - from: src/data
    to: data
