appId: com.ueconsole.adb
productName: UE Console ADB Tool
electronDist: node_modules/electron/dist
electronVersion: 33.2.0
directories:
  buildResources: resources
  output: release
files:
  - dist
  - out
win:
  target:
    - nsis
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
extraResources:
  - from: src/data
    to: data
  - from: autotestscripts
    to: autotestscripts
